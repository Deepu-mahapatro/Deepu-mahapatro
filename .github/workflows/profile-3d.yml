name: Generate My 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate my contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Deepu-mahapatro

      - name: Commit generated SVG files
        uses: EndBug/add-and-commit@v9
        with:
          add: "profile-3d-contrib/*.svg"
          message: "Update my 3D contribution calendar"
